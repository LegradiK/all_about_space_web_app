name: Sky alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC); GitHub may delay runs a little
  workflow_dispatch:          # adds a "Run workflow" button for manual runs
    inputs:
      test:
        description: "Send a made-up test alert to you only (none = normal check)"
        type: choice
        options:
          - none
          - iss
          - aurora
          - both
        default: none

concurrency:
  group: sky-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: horizon-intelligence 
    timeout-minutes: 8

    env:
      ALERT_URL: ${{ secrets.ALERT_URL }}
      ALERT_TASK_TOKEN: ${{ secrets.ALERT_TASK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TEST_MODE: ${{ inputs.test || 'none' }}   # scheduled runs have no input, so 'none'

    steps:
      - name: Check secrets
        run: |
          [ -n "$ALERT_URL" ]         || { echo "::error::ALERT_URL secret is missing"; exit 1; }
          [ -n "$ALERT_TASK_TOKEN" ] || { echo "::error::ALERT_TASK_TOKEN secret is missing"; exit 1; }
          echo "Site host: $(echo "$ALERT_URL" | cut -d/ -f3)"

      - name: Run alert check
        id: check
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 240 \
            --retry 2 --retry-delay 10 \
            -X POST \
            -H "X-Alert-Token: $ALERT_TASK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"test\": \"$TEST_MODE\"}" \
            "${ALERT_URL%/}/tasks/check-alerts")

          # Log the summary without the message texts
          echo "$response" | jq 'del(.telegram_outbox) + {telegram_queued: (.telegram_outbox | length)}'

          echo "$response" | jq -c '.telegram_outbox[]?' > outbox.jsonl
          echo "queued=$(wc -l < outbox.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Deliver queued Telegram messages
        if: steps.check.outputs.queued != '0'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Messages queued but TELEGRAM_BOT_TOKEN secret is missing"
            exit 0
          fi

          gone=()
          while IFS= read -r msg; do
            chat_id=$(jq -r '.chat_id' <<<"$msg")
            body=$(jq -c '{chat_id, text, parse_mode: "HTML", disable_web_page_preview: true}' <<<"$msg")
            result=$(curl --silent --max-time 20 \
              -H "Content-Type: application/json" -d "$body" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

            if [ "$(jq -r '.ok' <<<"$result")" != "true" ]; then
              desc=$(jq -r '.description // "unknown error"' <<<"$result")
              echo "::warning::Telegram send failed: $desc"
              case "$desc" in
                *blocked*|*"chat not found"*|*deactivated*|*kicked*) gone+=("$chat_id") ;;
              esac
            fi
            sleep 0.1   # stay well under Telegram's rate limit
          done < outbox.jsonl

          if [ ${#gone[@]} -gt 0 ]; then
            payload=$(printf '%s\n' "${gone[@]}" | jq -R 'tonumber' | jq -sc '{chat_ids: .}')
            curl --fail-with-body --silent --show-error --max-time 30 \
              -X POST \
              -H "X-Alert-Token: $ALERT_TASK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${ALERT_URL%/}/tasks/telegram-gone"
            echo
          fi